version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=netra
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml_service:8001
      - D3_SERVICE_URL=http://d3_service:8002
      - D4_SERVICE_URL=http://d4_service:8003
      - SESSION_SECRET=super-secret-prototype-key
      - EVIDENCE_STORAGE_PATH=/data/evidence/
    volumes:
      - evidence_data:/data/evidence/
    depends_on:
      - mongodb
      - neo4j
      - qdrant
      - redis
    networks:
      - netra

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - netra

  neo4j:
    image: neo4j:5.9
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    networks:
      - netra

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - netra

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - netra

  ml_service:
    build: .
    command: ["npm", "run", "mock:ml"]
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - SERVICE_TYPE=ml
    networks:
      - netra

  d3_service:
    build: .
    command: ["npm", "run", "mock:d3"]
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - SERVICE_TYPE=d3
    networks:
      - netra

  d4_service:
    build: .
    command: ["npm", "run", "mock:d4"]
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - SERVICE_TYPE=d4
    networks:
      - netra

volumes:
  evidence_data:
  mongodb_data:
  neo4j_data:
  qdrant_data:

networks:
  netra:
    name: netra
    driver: bridge
